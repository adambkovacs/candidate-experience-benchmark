<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero scene lab</title>
<style>
  /* Dev fixture for site/hero.js: one stage sized like the Read page hero (640 x 330, or full width on a phone). */
  body { margin: 0; min-height: 300vh; background: #1a2332; color: #c2cad9; font: 14px/1.5 'IBM Plex Sans', system-ui, sans-serif; }
  section { padding: 48px 24px; }
  .hero-stage { position: relative; width: 640px; height: 330px; outline: 1px dashed #3a4763; }
  .hero-stage-frame { position: absolute; inset: 0; }
  .hero-stage-frame > img, .hero-stage-frame > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-stage canvas { opacity: 0; transition: opacity .6s; }
  .hero-stage.is-live canvas { opacity: 1; }
  .hero-stage.is-live .hero-fallback { opacity: 0; transition: opacity .35s; }
  @media (max-width: 700px) { .hero-stage { width: 100%; height: 230px; } }
</style>
</head>
<body>
<section>
  <div class="hero-stage" aria-hidden="true" data-diff="DEV-006,DEV-013,DEV-027,DEV-029,DEV-030,DEV-059" data-ring="DEV-003">
    <div class="hero-stage-frame"><img class="hero-fallback" src="../hero-lattice.svg" alt=""></div>
  </div>
  <p>Dashed outline: the stage box. The whole 10 x 6 grid should sit inside it with margin.</p>
</section>
<script type="module" src="../hero.js"></script>
</body>
</html>
