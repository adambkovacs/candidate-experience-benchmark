name: Publish results explorer
on:
  push:
    branches: [main]
    paths: ['public-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Historical report timings were frozen under Python 3.14.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check static public bundle
        run: |
          test -f public-site/index.html
          test -f public-site/data.json
          test -z "$(find public-site -type l -print)"
          node --check public-site/reader.js
          python3 scripts/build_disputed_reviews_v1.py --check
          python3 scripts/build_extended_run_catalog_v1.py check
          python3 scripts/build_extended_cases_v1.py --check
          python3 scripts/analyze_native_agreement_policy_v1.py --check
          python3 -m unittest tests.test_extended_cases_v1 tests.test_analyze_native_agreement_policy_v1 -q
          node --check public-site/extended-cases.js
          node --test tests/test_extended_cases_ui.cjs tests/test_agreement_policy_ui.cjs
          node --check public-site/agreement-policy.js
          python3 -m unittest tests.test_disputed_reviews_v1 tests.test_extended_run_catalog_v1 -q
          node --check public-site/report-navigation.js
          node --check public-site/disputed-reviews.js
          node --test tests/test_report_navigation_ui.cjs tests/test_disputed_reviews_ui.cjs tests/test_extended_run_catalog_ui.cjs
          node --check public-site/liquid-prompt-chart.js
          node --test tests/test_liquid_prompt_chart_ui.cjs
          python3 scripts/build_reader_story.py --check
          python3 -m unittest tests.test_reader_story -q
          python3 scripts/build_mistral119_fresh1_p0_findings.py > /tmp/mistral119-fresh1-p0-findings.json
          cmp /tmp/mistral119-fresh1-p0-findings.json public-site/mistral119-fresh1-p0-findings.json
          python3 -m unittest tests.test_build_mistral119_fresh1_p0_findings -q
          python3 scripts/build_clef_flash_p1_findings.py --check
          python3 -m unittest tests.test_build_clef_flash_p1_findings -q
          python3 scripts/build_clef_flash_p2_findings.py --check
          python3 -m unittest tests.test_build_clef_flash_p2_findings -q
          python3 scripts/build_supplemental_decision_runs_v1.py check
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p test_build_supplemental_decision_runs_v1.py -q
          node --test tests/test_supplemental_decision_ui.cjs tests/test_clef_repeat_chart_ui.cjs
          python3 scripts/build_analysis_refresh.py --check
          python3 -m unittest tests.test_analysis_refresh -q
          node --test tests/test_analysis_refresh_ui.cjs tests/test_clef_current_matrix_ui.cjs tests/test_clef_p0_third_checkpoint_ui.cjs
          python3 scripts/build_legacy_qwen_repeat_findings.py --check
          python3 -m unittest tests.test_build_legacy_qwen_repeat_findings -q
          node --test tests/test_legacy_qwen_repeat_ui.cjs
          node --check public-site/app.js
          python3 -m unittest tests.test_subscription_price_estimates -q
          node --test tests/test_subscription_price_ui.cjs tests/test_public_pairing_ui.cjs
          node --check public-site/findings.js
          node --check public-site/repeats.js
          node --test tests/test_sonnet55_public_ui.cjs
          python3 scripts/export_claude_public_evidence.py --output-dir public-site/sonnet55-fresh-matched3-evidence --check
          python3 scripts/build_sonnet55_matched3_findings.py --check-public public-site/sonnet55-fresh-matched3-evidence
          python3 -m unittest tests.test_build_sonnet55_matched3_findings -q
          node --test tests/test_public_repeat_ui.cjs tests/test_small_local_repeat_ui.cjs tests/test_anyjev_raw_repeat_ui.cjs tests/test_anyjev_l0_repeat_ui.cjs tests/test_anyjev_l1_repeat_ui.cjs tests/test_anyjev_l2_repeat_ui.cjs tests/test_anyjev_generated_repeat_ui.cjs tests/test_openjev_native_repeat_ui.cjs tests/test_openjev_generated_repeat_ui.cjs tests/test_semif_generated_repeat_ui.cjs tests/test_alex_native_repeat_ui.cjs tests/test_codex_fresh_repeat_ui.cjs tests/test_deepseek_fresh_repeat_ui.cjs tests/test_additional_hosted_fresh_repeat_ui.cjs tests/test_qwen36_continuation_ui.cjs tests/test_deepseek_low_interruption_ui.cjs tests/test_latest_continuation_cutoffs_ui.cjs tests/test_qwen27_second_continuation_ui.cjs tests/test_qwen27_final_descriptive_ui.cjs
          node --test tests/test_kev_repeat_ui.cjs
          node --test tests/test_kev_prompt_ui.cjs
          python3 scripts/build_kev_native_prompt_findings.py --check
          python3 -m unittest tests.test_build_kev_native_prompt_findings -q
          node --test tests/test_jev_prompt_ui.cjs
          python3 scripts/build_jev_native_prompt_findings.py --json-output public-site/jev-native-prompt-findings.json --check
          python3 -m unittest tests.test_build_jev_native_prompt_findings -q
          python3 scripts/build_kev_native_findings.py --check
          python3 -m unittest tests.test_build_kev_native_findings -q
          python3 scripts/build_repeat_findings.py --check
          python3 scripts/build_hosted_wave_findings.py --output public-site/hosted-repeats.json --check
          python3 -m unittest tests.test_hosted_repeat_findings tests.test_hosted_wave_findings -q
          python3 scripts/export_claude_public_evidence.py --output-dir public-evidence/claude-20260928/claude-roster --check
          cmp public-evidence/claude-20260928/claude-roster/report.json public-site/claude-roster-repeats.json
          python3 scripts/export_claude_public_evidence.py --output-dir public-evidence/claude-20260928/haiku --check
          cmp public-evidence/claude-20260928/haiku/report.json public-site/haiku-fresh-matched3.json
          python3 scripts/export_claude_public_evidence.py --output-dir public-evidence/claude-20260928/opus-medium --check
          cmp public-evidence/claude-20260928/opus-medium/report.json public-site/claude-repeats.json
          python3 -m unittest tests.test_export_claude_public_evidence -q
          python3 -m unittest tests.test_public_claude_bundle_release -q
          python3 scripts/export_historical_claude_links.py --check
          python3 -m unittest tests.test_historical_claude_links -q
          python3 scripts/build_gemini31_high_authority_v2_findings.py --output public-site/gemini-repeats.json --check
          python3 -m unittest tests.test_build_gemini_repeat_findings tests.test_build_gemini38_low_repeat_findings tests.test_build_gemini31_high_authority_v2_findings -q
          python3 -m unittest discover -s tests -p test_repeat_findings.py -q
          python3 scripts/build_jev_confidence_findings.py --check
          python3 -m unittest tests.test_build_jev_confidence_findings -q
          python3 scripts/build_typesafe_repeat_findings.py --output public-site/typesafe-repeats.json --check
          python3 -m unittest tests.test_build_typesafe_repeat_findings -q
          python3 scripts/build_laya_repeat_findings.py --output public-site/laya-repeats.json --check
          python3 -m unittest tests.test_build_laya_repeat_findings -q
          python3 scripts/build_semif_repeat_findings.py --output public-site/semif-repeats.json --check
          python3 -m unittest tests.test_build_semif_repeat_findings -q
          if test -f public-site/semif-generated-repeats.json; then python3 scripts/build_semif_generated_repeat_findings.py --output public-site/semif-generated-repeats.json --check; fi
          python3 -m unittest tests.test_build_semif_generated_repeat_findings -q
          python3 scripts/build_anyjev_generated_repeat_findings.py --output public-site/anyjev-generated-repeats.json --check
          python3 -m unittest tests.test_build_anyjev_generated_repeat_findings -q
          python3 scripts/build_anyjev_raw_repeat_findings.py --output public-site/anyjev-raw-repeats.json --check
          python3 -m unittest tests.test_build_anyjev_raw_repeat_findings -q
          python3 scripts/build_anyjev_l0_repeat_findings.py --output public-site/anyjev-l0-repeats.json --check
          python3 -m unittest tests.test_build_anyjev_l0_repeat_findings -q
          python3 scripts/build_anyjev_l1_repeat_findings.py --output public-site/anyjev-l1-repeats.json --check
          python3 -m unittest tests.test_build_anyjev_l1_repeat_findings -q
          python3 scripts/build_anyjev_l2_repeat_findings.py --output public-site/anyjev-l2-repeats.json --check
          python3 -m unittest tests.test_build_anyjev_l2_repeat_findings -q
          python3 scripts/build_openjev_native_repeat_findings.py --output public-site/openjev-native-repeats.json --check
          python3 -m unittest tests.test_build_openjev_native_repeat_findings -q
          if test -f public-site/openjev-generated-repeats.json; then python3 scripts/build_openjev_generated_repeat_findings.py --output public-site/openjev-generated-repeats.json --check; fi
          python3 -m unittest tests.test_build_openjev_generated_repeat_findings -q
          python3 scripts/build_alex_native_repeat_findings.py --output public-site/alex-native-repeats.json --check
          python3 -m unittest tests.test_build_alex_native_repeat_findings -q
          python3 scripts/build_codex_fresh_repeat_findings.py --output public-site/codex-fresh-repeats.json --check
          python3 -m unittest tests.test_build_codex_fresh_repeat_findings -q
          python3 scripts/build_deepseek_fresh_repeat_findings.py --output public-site/deepseek-fresh-repeats.json --check
          python3 -m unittest tests.test_build_deepseek_fresh_repeat_findings tests.test_additional_hosted_fresh_repeat_findings -q
          python3 scripts/build_deepseek_high_remaining7_price_findings.py check --output public-site/additional-hosted-fresh-repeats.json
          python3 -m unittest tests.test_build_qwen36_on_hosted_authority_v2_findings -q
          python3 -m unittest tests.test_build_deepseek_high_authority_v3_findings -q
          python3 scripts/build_deepseek_low_interruption_findings.py --check
          python3 -m unittest tests.test_build_deepseek_low_interruption_findings -q
          python3 scripts/build_qwen36_off_continuation_findings.py --output public-site/qwen36-off-continuation-findings.json --check
          python3 -m unittest tests.test_build_qwen36_off_continuation_findings -q
          python3 scripts/build_qwen36_off_second_interruption_findings.py --output public-site/qwen36-off-second-interruption-findings.json --check
          python3 -m unittest tests.test_build_qwen36_off_second_interruption_findings -q
          python3 scripts/build_gemma26_continuation_findings.py --output public-site/gemma26-continuation-findings.json --check
          python3 scripts/build_gemma26_postabort_findings.py --output public-site/gemma26-postabort-findings.json --check
          python3 -m unittest tests.test_gemma26_postabort_findings -q
          python3 scripts/build_gemma26_fresh3_checkpoint.py build --cutoff P0 --check
          python3 scripts/build_gemma26_fresh3_p1_interrupted.py build --check
          node --test tests/test_gemma26_fresh3_p1_interrupted_ui.cjs
          python3 scripts/build_gemma26_p2_repeat_findings.py --check
          python3 -m unittest tests.test_gemma26_p2_repeat_findings -q
          python3 scripts/build_clef_p0_repeat_findings.py --check
          python3 -m unittest tests.test_clef_p0_repeat_findings -q
          python3 scripts/build_clef_p0_third_checkpoint.py --check
          python3 -m unittest tests.test_clef_p0_third_checkpoint -q
          python3 -m unittest tests.test_build_gemma26_continuation_findings -q
          node --test tests/test_gemma26_continuation_ui.cjs
          python3 -m unittest tests.test_build_qwen27_interrupted_continuation_findings tests.test_build_deepseek_low_third_interruption_findings -q
          python3 -m unittest tests.test_build_qwen27_second_continuation_findings -q
          python3 -m unittest tests.test_build_qwen27_final_descriptive_findings -q
          # Three Gemma fixture tests read private, untracked suffix attempts; run the seven archive-safe tests here.
          # The full tracked archive rebuild and projection-tamper check below cover the published cutoff.
          python3 -m unittest \
            tests.test_build_gemma26_second_continuation_findings.SecondContinuationFindingsTests.test_clean_inputs_show_incomplete_without_public_final \
            tests.test_build_gemma26_second_continuation_findings.SecondContinuationFindingsTests.test_manifest_or_bound_source_tamper_rejected \
            tests.test_build_gemma26_second_continuation_findings.SecondContinuationFindingsTests.test_closed_journal_without_public_attestation_stays_unscored \
            tests.test_build_gemma26_second_continuation_findings.SecondContinuationFindingsTests.test_public_projection_excludes_provider_and_account_details \
            tests.test_build_gemma26_second_continuation_findings.SecondContinuationFindingsTests.test_composite_requires_exact_58_unsent_positions \
            tests.test_build_gemma26_second_continuation_findings.SecondContinuationFindingsTests.test_export_requires_controller_verified_closed_stage \
            tests.test_build_gemma26_second_continuation_findings.SecondContinuationFindingsTests.test_public_attestation_rejects_changed_private_hash -q
          cutoff_root=$(mktemp -d)
          trap 'rm -rf "$cutoff_root"' EXIT
          git archive 6bdf6cc2c4a0a24dd4088c96460e750563fc2af4 | tar -x -C "$cutoff_root"
          python3 "$cutoff_root/scripts/build_qwen27_interrupted_continuation_findings.py" --root "$cutoff_root" --output "$cutoff_root/qwen27.json"
          cmp "$cutoff_root/qwen27.json" public-site/qwen27-interrupted-continuation-findings.json
          python3 "$cutoff_root/scripts/build_gemma26_second_continuation_findings.py" --root "$cutoff_root" --output "$cutoff_root/gemma26.json"
          cmp "$cutoff_root/gemma26.json" public-site/gemma26-second-continuation-findings.json
          python3 "$cutoff_root/scripts/build_deepseek_low_third_interruption_findings.py" --root "$cutoff_root" --output "$cutoff_root/deepseek.json"
          cmp "$cutoff_root/deepseek.json" public-site/deepseek-low-third-interruption-findings.json
          python3 - "$cutoff_root" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          stage = Path(sys.argv[1]) / 'results/repeatability-v1/gemma26-on-fresh-matched3-v2/second-interruption-continuation-v1/fresh2/P0'
          summary_path = stage / 'suffix.public-summary.json'
          review_path = stage / 'suffix.public-review.json'
          summary = json.loads(summary_path.read_text())
          summary['responses'][0]['requestSha256'] = '0' * 64
          summary_path.write_text(json.dumps(summary) + '\n')
          review = json.loads(review_path.read_text())
          review['summarySha256'] = hashlib.sha256(summary_path.read_bytes()).hexdigest()
          review_path.write_text(json.dumps(review) + '\n')
          PY
          if python3 "$cutoff_root/scripts/build_gemma26_second_continuation_findings.py" --root "$cutoff_root" > "$cutoff_root/tamper.stdout" 2> "$cutoff_root/tamper.stderr"; then
            echo "Gemma public projection tamper was accepted" >&2
            exit 1
          fi
          grep -q 'frozen request' "$cutoff_root/tamper.stderr"
          second_root=$(mktemp -d)
          git archive 61840a642c5ea31b6670869089c5aa087439ba76 | tar -x -C "$second_root"
          python3 "$second_root/scripts/build_qwen27_second_continuation_findings.py" --root "$second_root" --output "$second_root/qwen27-second.json"
          cmp "$second_root/qwen27-second.json" public-site/qwen27-second-continuation-findings.json
          rm -rf "$second_root"
          final_root=$(mktemp -d)
          git archive e4ee58d525f53751cc88c97185bee86064a241d4 | tar -x -C "$final_root"
          python3 "$final_root/scripts/build_qwen27_final_descriptive_findings.py" --root "$final_root" --output "$final_root/qwen27-final.json"
          cmp "$final_root/qwen27-final.json" public-site/qwen27-final-descriptive-findings.json
          rm -rf "$final_root"
          python3 scripts/build_e4b_interruption_findings.py --output public-site/e4b-interruption-findings.json --check
          python3 -m unittest tests.test_build_e4b_interruption_findings -q
          node --test tests/test_e4b_interruption_ui.cjs
          python3 scripts/build_small_local_repeat_findings.py --output public-site/small-local-repeats.json --check
          python3 -m unittest tests.test_build_small_local_repeat_findings -q
          python3 scripts/build_findings.py --check
          python3 -m unittest discover -s tests -p test_findings.py -q
          python3 scripts/export_provider_error_public_evidence.py --check-public
          python3 scripts/build_public_explorer.py --provider-error-projection --check
          python3 scripts/build_findings.py --source public-site/data-provider-errors-v1.json --output public-site/findings-provider-errors-v1.json --check
          python3 -m unittest tests.test_export_provider_error_public_evidence tests.test_project_provider_error_public_bindings tests.test_resolve_provider_error_public_source -q
          python3 -m json.tool public-site/data.json > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
