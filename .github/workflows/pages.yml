name: Publish results explorer
on:
  push:
    branches: [main]
    paths: ['public-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check static public bundle
        run: |
          test -f public-site/index.html
          test -f public-site/data.json
          test -z "$(find public-site -type l -print)"
          node --check public-site/app.js
          node --check public-site/findings.js
          node --check public-site/repeats.js
          node --test tests/test_public_repeat_ui.cjs
          python3 scripts/build_repeat_findings.py --check
          python3 scripts/build_hosted_wave_findings.py --output public-site/hosted-repeats.json --check
          python3 -m unittest tests.test_hosted_repeat_findings tests.test_hosted_wave_findings -q
          python3 scripts/export_claude_public_evidence.py --output-dir public-evidence/claude-20260928/claude-roster --check
          cmp public-evidence/claude-20260928/claude-roster/report.json public-site/claude-roster-repeats.json
          python3 scripts/export_claude_public_evidence.py --output-dir public-evidence/claude-20260928/haiku --check
          cmp public-evidence/claude-20260928/haiku/report.json public-site/haiku-fresh-matched3.json
          python3 scripts/export_claude_public_evidence.py --output-dir public-evidence/claude-20260928/opus-medium --check
          cmp public-evidence/claude-20260928/opus-medium/report.json public-site/claude-repeats.json
          python3 -m unittest tests.test_export_claude_public_evidence -q
          python3 -m unittest tests.test_build_claude_repeat_findings tests.test_build_claude_roster_findings tests.test_build_haiku_matched3_findings -q
          python3 scripts/build_gemini_repeat_findings.py --output public-site/gemini-repeats.json --check
          python3 -m unittest tests.test_build_gemini_repeat_findings -q
          python3 -m unittest discover -s tests -p test_repeat_findings.py -q
          python3 scripts/build_typesafe_repeat_findings.py --output public-site/typesafe-repeats.json --check
          python3 -m unittest tests.test_build_typesafe_repeat_findings -q
          python3 scripts/build_findings.py --check
          python3 -m unittest discover -s tests -p test_findings.py -q
          python3 -m json.tool public-site/data.json > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
